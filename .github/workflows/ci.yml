name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: tests
        run: python -m pytest -q
      - name: the demo runs end to end without a key
        run: python silo.py demo --scripted
      - name: the audit chain verifies
        run: |
          python silo.py init --fresh
          python silo.py verify
      - name: house style
        run: python scripts/check_style.py
      - name: the demo replays from committed cassettes, with no key
        env:
          SILO_LLM_MODE: replay
        run: python silo.py demo
